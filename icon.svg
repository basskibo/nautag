<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc3ff"/>
      <stop offset="1" stop-color="#0a6cf5"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf3"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00265e" flood-opacity="0.35"/>
    </filter>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body with ~185px continuous corners on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#body)"/>
  <g transform="rotate(-30 512 512)" filter="url(#drop)">
    <path d="M300 372H690a40 40 0 0 1 40 40V612a40 40 0 0 1-40 40H300L196 540a40 40 0 0 1 0-56Z" fill="url(#tag)"/>
    <circle cx="272" cy="512" r="26" fill="#2a8cff"/>
    <g stroke="#fff" stroke-width="12">
      <circle cx="604" cy="512" r="58" fill="#007aff"/>
      <circle cx="520" cy="512" r="58" fill="#ffcc00"/>
      <circle cx="436" cy="512" r="58" fill="#ff3b30"/>
    </g>
  </g>
</svg>
